<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="./js/script.js" type="module"></script>
</head>

<body>
    <div id="file-explorer">
        <aside class="navigation">
            <h1>File Explorer</h1>

            <div class="this-pc">
                <h3>This PC</h3>
                <div class="pc-folders">
                    <div class="pc-folder">
                        <img src="./images/recents.png" alt="" class="icon">
                        <p>Recents</p>
                    </div>
                    <div class="pc-folder">
                        <img src="./images/google-docs.png" alt="" class="icon">
                        <p>Documents</p>
                    </div>
                    <div class="pc-folder">
                        <img src="./images/download.png" alt="" class="icon">
                        <p>Downloads</p>
                    </div>
                    <div class="pc-folder">
                        <img src="./images/musical-note.png" alt="" class="icon">
                        <p>Music</p>
                    </div>
                    <div class="pc-folder">
                        <img src="./images/youtube.png" alt="" class="icon">
                        <p>Videos</p>
                    </div>
                    <div class="pc-folder">
                        <img src="./images/pictures.png" alt="" class="icon">
                        <p>Pictures</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="explorer">
            <div class="header">
                <div class="path">
                    <p>Local Disk C:</p>
                    <p class="arrow">></p>
                    <p class="active">Downloads</p>
                </div>
                <div class="options">
                    <div class="nav-controls">
                        <button class="left"><img src="./images//right-arrow.png" alt=""></button>
                        <button class="right"><img src="./images//right-arrow.png" alt=""></button>
                    </div>
                    <div class="nav-actions">
                        <button class="add-folder"><img src="./images/add-folder.png" alt=""></button>
                        <button class="sort"><img src="./images/sort.png" alt=""></button>
                        <button class="add-folder"><img src="./images/add-folder.png" alt=""></button>
                        <button class="sort"><img src="./images/scissors.png" alt=""></button>
                        <button class="add-folder"><img src="./images/paste.png" alt=""></button>
                        <button class="add-folder"><img src="./images/copy.png" alt=""></button>
                        <button class="sort"><img src="./images/delete.png" alt=""></button>
                    </div>
                    <div class="search">
                        <img src="./images/search.png" alt="">
                        <input type="text" placeholder="Search">
                    </div>
                </div>
            </div>
            <div class="folder-container">
                <!-- <div class="local-disk">
                    <img src="./images/local-disk.png" alt="">
                    <div>
                        <p class="label">New Volume (C:)</p>
                        <div class="storage">

                        </div>
                        <p class="label">18GB free of 22GB</p>
                    </div>
                </div> -->
                <div class="object folder">
                    <img src="./images/folder.png" alt="">
                    <div class="name">
                        <p>New Folder</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
