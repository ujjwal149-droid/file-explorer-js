<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="./js/script.js" type="module"></script>
</head>

<body>
    <div id="desktop" aria-label="Desktop">
        <button id="explorer-shortcut" class="desktop-shortcut" type="button" aria-label="Open File Explorer"
            aria-pressed="true">
            <img src="./images/sketch-theme/icons/old-computer.png" alt="">
            <span>File Explorer</span>
        </button>
    </div>

    <section id="app-window" aria-label="File Explorer window">
        <div class="window-titlebar">
            <span>File Explorer</span>
            <button id="minimize-explorer" type="button" aria-label="Minimize File Explorer"
                title="Minimize">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M3 11.5h10" />
                </svg>
            </button>
        </div>

        <!-- Sidebar navigation and the active folder view. -->
        <div id="file-explorer">
        <aside class="navigation">
            <h1>File Explorer</h1>

            <div class="this-pc">
                <h3>This PC</h3>
                <div class="pc-folders">
                    <div class="pc-folder">
                        <img src="./images/sketch-theme/icons/clock.png" alt="" class="icon">
                        <p>Recents</p>
                    </div>
                    <div class="pc-folder">
                        <img src="./images/sketch-theme/icons/document.png" alt="" class="icon">
                        <p>Documents</p>
                    </div>
                    <div class="pc-folder">
                        <img src="./images/sketch-theme/icons/download.png" alt="" class="icon">
                        <p>Downloads</p>
                    </div>
                    <div class="pc-folder">
                        <img src="./images/sketch-theme/icons/music-note.png" alt="" class="icon">
                        <p>Music</p>
                    </div>
                    <div class="pc-folder">
                        <img src="./images/sketch-theme/icons/video-player.png" alt="" class="icon">
                        <p>Videos</p>
                    </div>
                    <div class="pc-folder">
                        <img src="./images/sketch-theme/icons/picture.png" alt="" class="icon">
                        <p>Pictures</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="explorer">
            <div class="header">
                <div class="path">
                    <!-- <p>Local Disk C:</p>
                    <p class="arrow">></p>
                    <p class="active">Downloads</p> -->
                </div>
                <div class="options">
                    <div class="nav-controls">
                        <button class="left" disabled><img src="./images/sketch-theme/icons/left-arrow.png" alt=""></button>
                        <button class="right"><img src="./images/sketch-theme/icons/left-arrow.png" alt=""></button>
                    </div>
                    <div class="nav-actions">
                        <button class="add-folder"><img src="./images/sketch-theme/icons/new-folder.png"
                                alt=""></button>
                        <button class="cut"><img src="./images/sketch-theme/icons/cut.png" alt=""></button>
                        <button class="copy"><img src="./images/sketch-theme/icons/copy.png" alt=""></button>
                        <button class="paste"><img src="./images/sketch-theme/icons/paste.png" alt=""></button>
                        <button class="delete"><img src="./images/sketch-theme/icons/delete-file.png" alt=""></button>
                        <button class="sort"><img src="./images/sketch-theme/icons/sort.png" alt=""></button>
                        <button class="rename"><img src="./images/sketch-theme/icons/edit.png" alt=""></button>
                    </div>
                    <div class="search">
                        <img src="./images/sketch-theme/icons/search.png" alt="">
                        <input type="text" placeholder="Search">
                    </div>
                </div>
            </div>
            <div id="folder-container">
                <!-- JavaScript clones this template for each child folder. -->
                <template class="object-template">
                    <div class="object folder">
                        <img src="./images/sketch-theme/folder.png" alt="">
                        <div class="name">
                            New Folder
                        </div>
                    </div>
                </template>
            </div>
        </main>
        </div>
    </section>
</body>

</html>
